<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger - Merge PDFs Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fonts.gstatic.com/s/i/short-term/release/googlesymbols/picture_as_pdf/default/24px.svg" type="image/svg+xml">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <h1>PDF Merger</h1>
                </div>
                <p class="tagline">Merge multiple PDFs into one</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Left Panel: Upload & File List -->
                <section class="left-panel">
                    <!-- Upload Area -->
                    <div class="upload-section">
                        <div id="dropZone" class="drop-zone" role="region" aria-label="Drag and drop PDFs here or click to browse">
                            <div class="drop-zone-content">
                                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <h2>Drop PDFs here</h2>
                                <p>or <button class="browse-btn" id="browseBtn" aria-label="Browse for PDF files">browse from your computer</button></p>
                                <small>Supported: PDF files only</small>
                            </div>
                            <input 
                                type="file" 
                                id="fileInput" 
                                multiple 
                                accept=".pdf,application/pdf" 
                                class="file-input"
                                aria-hidden="true"
                            >
                        </div>

                        <!-- Upload Progress -->
                        <div id="uploadProgress" class="upload-progress" style="display: none;">
                            <div class="progress-bar">
                                <div id="progressFill" class="progress-fill"></div>
                            </div>
                            <p id="progressText">Uploading...</p>
                        </div>
                    </div>

                    <!-- File List -->
                    <div class="files-section">
                        <div class="files-header">
                            <h3>Uploaded Files</h3>
                            <span id="fileCount" class="file-count">0</span>
                        </div>
                        <div id="filesList" class="files-list">
                            <p class="empty-state">No PDFs uploaded yet</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button 
                            id="mergeBtn" 
                            class="btn btn-primary" 
                            disabled 
                            aria-label="Merge all uploaded PDFs"
                        >
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            </svg>
                            Merge PDFs
                        </button>
                        <button 
                            id="clearBtn" 
                            class="btn btn-secondary" 
                            disabled
                            aria-label="Clear all uploaded files"
                        >
                            Trash All Files
                        </button>
                    </div>
                </section>

                <!-- Right Panel: Preview & Download -->
                <section class="right-panel">
                    <!-- Preview Section -->
                    <div class="preview-section">
                        <h3>Preview</h3>
                        <div id="previewPlaceholder" class="preview-placeholder">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <p>Click on a PDF to preview</p>
                        </div>
                        <div id="previewViewer" class="preview-viewer" style="display: none;">
                            <div id="previewHeader" class="preview-header">
                                <div id="previewFileName" class="preview-file-name"></div>
                                <button id="closePreviewBtn" class="preview-close-btn" aria-label="Close preview">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                            <div id="previewCanvas" class="preview-canvas"></div>
                            <div class="preview-controls">
                                <button id="previewPrevBtn" class="btn btn-secondary" aria-label="Previous page">← Previous</button>
                                <span id="previewPageIndicator" class="preview-page-indicator">Page 1</span>
                                <button id="previewNextBtn" class="btn btn-secondary" aria-label="Next page">Next →</button>
                            </div>
                        </div>
                    </div>

                    <!-- Download Section -->
                    <div class="download-section" id="downloadSection" style="display: none;">
                        <h3>Ready to Download</h3>
                        <div class="download-info">
                            <p id="downloadFileName"></p>
                            <p id="downloadFileSize"></p>
                        </div>
                        <div class="download-controls">
                            <input 
                                type="text" 
                                id="downloadName" 
                                class="download-name-input" 
                                placeholder="Enter file name"
                                aria-label="Name for merged PDF"
                            >
                            <button 
                                id="downloadBtn" 
                                class="btn btn-success"
                                aria-label="Download merged PDF"
                            >
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                Download PDF
                            </button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Nikhil Chaudhary &mdash; PDF Merger Tool </p>
    </footer>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="previewTitle">Preview</h2>
                <div class="modal-header-actions">
                    <button class="modal-action-btn" id="expandToInlineBtn" title="Expand to panel" aria-label="Expand preview to inline panel">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                    <button class="modal-close" id="closeModal" aria-label="Close preview modal">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="modal-body">
                <div id="previewContainer" class="preview-container"></div>
            </div>
            <div class="modal-footer">
                <button id="prevPageBtn" class="btn btn-secondary" aria-label="Previous page">← Previous</button>
                <span id="pageIndicator" class="page-indicator">Page 1</span>
                <button id="nextPageBtn" class="btn btn-secondary" aria-label="Next page">Next →</button>
            </div>
        </div>
        <div class="modal-overlay" id="modalOverlay"></div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
        <div class="spinner-content">
            <div class="spinner"></div>
            <p id="loadingText">Merging PDFs...</p>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
